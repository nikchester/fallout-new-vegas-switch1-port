# Builds the Switch 1 toolchain check (port/switch1/hello) in tools/switch1's container and keeps the NRO as an artifact.
name: switch1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ENGINE=docker tools/switch1/build.sh port/switch1/hello
      - run: ls -l port/switch1/hello/hello.nro
      - uses: actions/upload-artifact@v4
        with:
          name: hello-nro
          path: port/switch1/hello/hello.nro
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ENGINE=docker tools/switch1/build.sh port/switch1/probe
      - run: make -C port/switch1/probe/linux && ./port/switch1/probe/linux/cpubench
      - uses: actions/upload-artifact@v4
        with:
          name: probe-nro
          path: port/switch1/probe/probe.nro
  guest_heap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/test_guest_heap.sh
      - run: |
          for d in -DFNV_GUEST_BASE_RUNTIME -DFNV_GUEST_BASE=0x100000000000ull ""; do
            c++ -std=c++17 -m64 $d -fsyntax-only -Iport/recomp port/recomp/pal_kernel.cpp
          done
